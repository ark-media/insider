# Keeps the pins from rotting.
#
# Every `uses:` in .github/workflows is pinned to a full commit SHA (the
# migrate job is handed the production owner-role DATABASE_URL, so a moved tag
# must not be able to change what runs there). Dependabot understands the
# trailing `# vX.Y.Z` comment and bumps the SHA and the comment together.
#
# Not covered: `bun-version` in migrate.yml. Bump that by hand.

version: 2

# Everything (npm packages and GitHub Actions, majors included) arrives as ONE
# pull request a week, so there's a single thing to review and merge and the
# lockfile never conflicts with a sibling bump. Security updates are separate
# and still open on their own as soon as an advisory lands.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies

  # pnpm is detected from pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
    # An update-types ignore leaves security updates switched on.
    ignore:
      # Pinned exact on purpose (22.4.0's types break the retention coupon
      # code); bump it by hand.
      - dependency-name: stripe
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Must match the Node major we run on (engines: 24.x, Vercel). Newer
      # types would let code use APIs that don't exist at runtime. Bump the
      # major here together with engines.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
