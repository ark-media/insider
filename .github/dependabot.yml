# Keeps the pins from rotting.
#
# Every `uses:` in .github/workflows is pinned to a full commit SHA (the
# migrate job is handed the production owner-role DATABASE_URL, so a moved tag
# must not be able to change what runs there). Dependabot understands the
# trailing `# vX.Y.Z` comment and bumps the SHA and the comment together.
#
# Not covered: `bun-version` in migrate.yml. Bump that by hand.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci

  # pnpm is detected from pnpm-lock.yaml. Minor and patch bumps arrive as one
  # grouped PR a week; majors come one at a time so each gets read. Security
  # updates are separate from this limit and always open.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # stripe is pinned exact on purpose (22.4.0's types break the retention
    # coupon code); bump it by hand. An update-types ignore leaves security
    # updates for it switched on.
    ignore:
      - dependency-name: stripe
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    commit-message:
      prefix: deps
