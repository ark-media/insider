name: Migrate database

# Runs Neon Postgres migrations against the database that matches the branch.
#
#   push to main        ->  `preview` environment     ->  ark-insider-dev
#   push to production  ->  `production` environment  ->  ark-insider-prod
#
# Each GitHub Environment holds its own DATABASE_URL secret: the same database
# as the Vercel environment of the same name, so the schema a build runs
# against is the schema its branch migrated. It must be Neon's DIRECT host, not
# the `-pooler` one Vercel uses — the runner holds a session-level advisory
# lock, and the pooler (transaction mode) can't keep one. main is staging (a Vercel preview build once
# the Production Branch is flipped to `production`), so a merge migrates the
# staging database straight away. production is what "Deploy to production"
# fast-forwards, so prod's schema moves at the same moment its code does.
#
# Triggers:
#   * push to main or production when migrations/, the runner, or this
#     workflow change.
#   * manual dispatch (Actions tab -> Run workflow). The branch you dispatch
#     FROM picks the database, exactly as a push would, so production can only
#     ever be migrated with the migrations production actually has. Dispatching
#     from any other branch is skipped rather than let an unmerged migration
#     reach a shared database.
#
# Approval gate:
#   Required reviewers live on the `production` environment, so a prod run
#   pauses until someone approves it. `preview` has none: a merge to main
#   migrates staging without a click.
#
# Why path-filtered: the migration runner is idempotent (a run with nothing
# pending is a clean no-op), but each production push would still queue an
# approval. The filter scopes runs to commits that actually change schema.
#
# Ordering caveat: this and the Vercel build both start from the same push, so
# they race. The production approval gate is the lever for holding one back
# when an order is needed.

on:
  push:
    branches: [main, production]
    paths:
      - 'migrations/**'
      - 'scripts/migrate.ts'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

# Serialize per database: a second run against the same target queues behind
# the first (including one parked on approval), so migrations never overlap.
# Preview and production are separate databases and don't block each other.
concurrency:
  group: migrate-${{ github.ref_name == 'production' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations (${{ github.ref_name == 'production' && 'production' || 'preview' }})
    # Only the two long-lived branches map to a database. A manual dispatch from
    # anywhere else is skipped rather than migrating staging with unmerged work.
    if: github.ref_name == 'main' || github.ref_name == 'production'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'preview' }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Bun runs the migration scripts; pnpm owns installs (see packageManager
      # in package.json, which also pins pnpm's exact version).
      #
      # Every action here is pinned to a commit SHA and Bun to an exact version:
      # this job is handed the production owner-role DATABASE_URL, so nothing
      # it runs may change underneath it. Dependabot (.github/dependabot.yml)
      # proposes the action bumps; bump bun-version by hand.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.9'

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Show approvers exactly what will run before they merged-then-approve.
      # Pending entries from this output should match the diff that triggered
      # the workflow.
      - name: Show status (before)
        run: bun run migrate:status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply pending migrations
        run: bun run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Show status (after)
        if: always()
        run: bun run migrate:status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
