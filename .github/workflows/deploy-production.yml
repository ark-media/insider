name: Deploy to production

# The only thing in this repo that moves ark-plus.xyz.
#
# Vercel's Production Branch for the `arkmedia` project is `production`, not
# `main`, so merging to main produces a preview build (staging) and nothing
# else. This workflow fast-forwards `production` to the ref you dispatch it
# with; the resulting push reaches Vercel as a normal GitHub webhook, and
# Vercel builds that commit with production environment variables and
# re-aliases ark-plus.xyz.
#
# Why a git push rather than `vercel deploy --prod`: production ends up
# recorded in the repo, the build runs with the production env scope by
# construction, and no VERCEL_TOKEN has to live in repo secrets. The Vercel
# dashboard's Redeploy and Instant Rollback buttons keep working on top of it.
#
# Note on GITHUB_TOKEN: a push made with it deliberately does not start other
# Actions workflows, but it does deliver the push webhook to installed apps
# like Vercel, so the deploy still fires. If that ever changes, swap in a PAT
# or a Vercel deploy hook.
#
# Approval gate:
#   The job targets the `production` GitHub Environment. Add required
#   reviewers in Settings -> Environments -> production to make every run
#   pause for a click before it pushes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to ship (must already be on main)'
        required: false
        default: 'main'
        type: string
      force:
        description: 'Allow a non-fast-forward push, or a commit that is not on main (rollback / sideways move)'
        required: false
        default: false
        type: boolean

# A second run queues behind the first rather than racing it onto the branch.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Fast-forward production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # Full history: the fast-forward check needs both branches' ancestry.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Inputs go through the environment, never string-interpolated into the
      # shell, so a branch name can't smuggle in commands.
      - name: Resolve the commit to ship
        id: target
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify "origin/${REF}^{commit}" 2>/dev/null \
            || git rev-parse --verify "${REF}^{commit}")
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Shipping $(git log -1 --format='%h %s' "${sha}")"

      # Production only ever gets commits that are already on main, i.e. that
      # went through main's pull-request review. Without this, any pushed
      # branch or bare SHA could be dispatched straight onto ark-plus.xyz.
      # force: true skips it, because a sideways move (a hotfix cut from
      # production) is by definition not on main; that path relies on the
      # `production` environment's required reviewer instead.
      - name: Refuse a commit that is not on main
        env:
          SHA: ${{ steps.target.outputs.sha }}
          REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "${SHA} is on main."
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "::warning::${SHA} is NOT on main; shipping it anyway because force is true."
            {
              echo "### :warning: Shipping a commit that is not on main"
              echo "\`${REF}\` has not been through main's review. force: true overrode the check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::${SHA} is not an ancestor of origin/main, so it has not been reviewed."
          echo "Refusing to ship '${REF}'."
          echo "Merge it to main through a pull request, then dispatch this workflow again with ref: main"
          echo "(or that merged commit). To ship an unmerged commit on purpose (a hotfix or"
          echo "a rollback target that never reached main), dispatch again with force: true."
          exit 1

      # The operator sees exactly what production gains before it lands. On a
      # non-fast-forward this is also where they find out what it would lose.
      - name: Show what this changes
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Shipping to production"
            echo
            echo '```'
            git log -1 --format='%H%n%an, %ad%n%s' --date=short "${SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! git rev-parse --verify --quiet origin/production >/dev/null; then
            echo "production branch does not exist yet; it will be created here."
            exit 0
          fi

          # git log exits 0 on an empty range, so test the output, not $?.
          ahead=$(git log --oneline "origin/production..${SHA}")
          {
            echo "### Commits production gains"
            echo '```'
            echo "${ahead:-(none - production is already at this commit)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Anything listed here is live right now and would be dropped.
          behind=$(git log --oneline "${SHA}..origin/production")
          if [ -n "$behind" ]; then
            {
              echo "### :warning: Commits production LOSES"
              echo '```'
              echo "$behind"
              echo '```'
              echo "This push is not a fast-forward and will be rejected"
              echo "unless it was dispatched with force: true."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push to the production branch
        env:
          SHA: ${{ steps.target.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "Force push requested — production may move backwards."
            git push --force origin "${SHA}:refs/heads/production"
          else
            # Without --force this is rejected unless it is a clean
            # fast-forward, which is the guard against shipping a branch that
            # is missing work already live.
            git push origin "${SHA}:refs/heads/production"
          fi

      - name: Where to watch it
        run: |
          {
            echo
            echo "Vercel is building the \`production\` branch now."
            echo "Build: https://vercel.com/hannah-waxman/arkmedia/deployments"
            echo "Live: https://ark-plus.xyz"
          } >> "$GITHUB_STEP_SUMMARY"
