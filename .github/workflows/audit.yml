name: Dependency audit

# Fails if any production dependency has a known vulnerability advisory.
# pnpm audit resolves from pnpm-lock.yaml alone, so no install step is needed.
#
# Triggers:
#   • PRs and pushes to main that change the dependency tree
#   • weekly schedule — advisories are published against versions we already
#     have, so dep-change triggers alone would miss them
#   • manual dispatch (Actions tab → Run workflow)
#
# Dev-only findings don't fail the build (--prod); they never ship to Vercel.
# They do run on developer machines and in the migrate job, though, so the
# weekly run also does a full audit that reports without blocking anything.

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reads the pnpm version from the packageManager field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Audit
        run: pnpm audit --prod

  # Build tooling and the migration runner's install include dev dependencies.
  # Report on them weekly, but never turn a PR red over one.
  audit-all:
    name: Audit all dependencies (report only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Audit (dev dependencies included)
        continue-on-error: true
        run: pnpm audit
